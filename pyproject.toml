[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["tasks", "scripts", "proxy"]

[project]
name = "training-inference-api-engine"
version = "0.1.0"
description = "Fine-tuning and inference pipeline for Qwen3.5 with LoRA adapters"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "transformers @ git+https://github.com/huggingface/transformers.git@main",
    "peft",
    "trl",
    "bitsandbytes",
    "accelerate",
    "mlflow",
    "datasets",
    "marimo",
    "sqlglot",
    "boto3>=1.42.63",
    "pydantic-settings>=2.13.1",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = ["ruff"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Marimo cell functions require uppercase parameter names (matching reactive exports
# from upstream cells) and Any annotations for dynamically injected dependencies.
"notebooks/*.py" = ["ANN401", "N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
